[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fcs-contracts"
version = "1.0.0"
description = "Factory Control System — saha sunucusu (edge) ile merkez arasındaki veri sözleşmeleri"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[tool.setuptools.packages.find]
include = ["fcs_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
